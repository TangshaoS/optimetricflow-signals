[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowsense-quant"
version = "0.1.0"
description = "Multi-Factor Alpha Signal Fusion & Market Regime Detection Toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "OptimetricFlow Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "akshare>=1.9.0"
]

[project.urls]
Homepage = "https://github.com/optimetricflow/optimetricflow-signals"
"OptimetricFlow" = "https://optimetricflow.cn"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowsense_quant*"]
